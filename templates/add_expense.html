{% extends "base.html" %}
{% block title %}Add expense — Expensify{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}" />
{% endblock %}
{% block content %}

<section class="auth-section">
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Add expense</h1>
      <p class="auth-subtitle">Record what you spent</p>
    </div>

    <div class="auth-card">
      {% if error %}
      <div class="auth-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('add_expense') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            class="form-input"
            step="0.01"
            min="{{ min_amount }}"
            placeholder="0.00"
            value="{{ form.get('amount', '') }}"
            required
            autofocus
          />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" class="form-input" required>
            <option value="">Select a category</option>
            {% for category in categories %}
            <option value="{{ category }}"{% if form.get('category') == category %} selected{% endif %}>{{ category }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input
            type="date"
            id="date"
            name="date"
            class="form-input"
            value="{{ form.get('date', '') }}"
            required
          />
        </div>
        <div class="form-group">
          <label for="description">Description (optional)</label>
          <input
            type="text"
            id="description"
            name="description"
            class="form-input"
            maxlength="{{ max_description_length }}"
            placeholder="What was this for?"
            value="{{ form.get('description', '') }}"
          />
        </div>
        <div class="expense-form-actions">
          <button type="submit" class="btn-submit">Add expense</button>
          <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>

{% endblock %}
